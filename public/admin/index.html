<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Companion Core Admin</title><link rel="stylesheet" href="/admin-ui/styles.css"></head>
<body>
  <header><div><p class="eyebrow">LOCAL CONTROL PLANE</p><h1>Companion Core</h1></div><div class="auth"><input id="admin-key" type="password" autocomplete="off" placeholder="Admin Key（仅保存在本标签页）"><button id="connect">连接</button></div></header>
  <nav><button data-tab="status" class="active">状态</button><button data-tab="persona">Persona</button><button data-tab="memory">Memory</button><button data-tab="sessions">Sessions</button><button data-tab="usage">Usage</button><button data-tab="modules">Modules</button><button data-tab="debug">检索调试</button></nav>
  <main>
    <div id="notice" class="notice">输入 Admin Key 后连接。本页面与 API 默认只允许 localhost。</div>
    <section id="status" class="tab active"><div class="section-head"><h2>Core 状态</h2><button data-action="load-status">刷新</button></div><div id="status-grid" class="cards"></div><h3>Agent Compatibility 决策统计</h3><div id="compat-metrics" class="panel muted">尚未加载</div><h3>最近错误</h3><div id="errors" class="panel muted">尚未加载</div></section>
    <section id="persona" class="tab"><div class="section-head"><h2>Persona 管理</h2><div><button data-action="import-persona">导入 JSON</button><button data-action="export-persona">导出 JSON</button><button data-action="save-persona" class="primary">保存</button></div></div><input id="persona-file" type="file" accept="application/json" hidden><div class="form-grid"><label>Persona<select id="persona-select"></select></label><label>名称<input id="persona-name"></label><label class="wide">Core identity<textarea id="persona-identity"></textarea></label><label class="wide">Personality（每行一项）<textarea id="persona-personality"></textarea></label><label>Tone<input id="persona-tone"></label><label>Verbosity<input id="persona-verbosity"></label><label>Emoji frequency<input id="persona-emoji"></label><label class="wide">Speaking rules（每行一项）<textarea id="persona-rules"></textarea></label><label class="wide">Chat Mode instruction<textarea id="persona-chat"></textarea></label><label class="wide">Agent Mode instruction<textarea id="persona-agent"></textarea></label><label>Memory enabled<select id="persona-memory-enabled"><option value="true">true</option><option value="false">false</option></select></label><label>Chat retrieval limit<input id="persona-chat-limit" type="number" min="0" max="100"></label><label>Agent retrieval limit<input id="persona-agent-limit" type="number" min="0" max="100"></label></div></section>
    <section id="memory" class="tab"><div class="section-head"><h2>Memory 管理</h2><button data-action="new-memory" class="primary">手动添加</button></div><div class="filters"><input id="memory-search" placeholder="搜索内容"><select id="memory-status"><option value="all">全部状态</option><option value="active">active</option><option value="staging">staging</option></select><select id="memory-type"><option value="">全部类型</option></select><input id="memory-source" placeholder="source"><select id="memory-pinned"><option value="all">全部</option><option value="true">仅 pinned</option><option value="false">未 pinned</option></select><button data-action="load-memory">筛选</button></div><div id="memory-list" class="table-wrap"></div><div id="memory-editor" class="editor hidden"><h3>编辑 Memory</h3><input id="memory-id" type="hidden"><label>内容<textarea id="memory-content"></textarea></label><div class="form-grid"><label>类型<select id="memory-edit-type"></select></label><label>状态<select id="memory-edit-status"><option>active</option><option>staging</option></select></label><label>Importance<input id="memory-importance" type="number" min="0" max="1" step="0.05"></label><label>Source<input id="memory-edit-source"></label><label><input id="memory-edit-pinned" type="checkbox"> pinned</label></div><div class="actions"><button data-action="cancel-memory">取消</button><button data-action="save-memory" class="primary">保存</button></div></div></section>
    <section id="sessions" class="tab"><div class="section-head"><h2>Session 管理</h2></div><div class="filters"><input id="session-search" placeholder="搜索 key / summary / message"><input id="session-source" placeholder="source"><select id="session-archived"><option value="all">全部</option><option value="active">未归档</option><option value="archived">已归档</option></select><button data-action="load-sessions">筛选</button></div><div id="session-list" class="table-wrap"></div><div id="session-detail" class="panel hidden"></div></section>
    <section id="usage" class="tab"><div class="section-head"><h2>Usage 管理</h2></div><div class="filters"><input id="usage-from" type="date"><input id="usage-to" type="date"><input id="usage-source" placeholder="source"><input id="usage-public-model" placeholder="public model"><input id="usage-upstream-model" placeholder="upstream model"><input id="usage-session" placeholder="session id"><select id="usage-kind"><option value="">chat + agent + summary</option><option>chat</option><option>agent</option><option>summary</option></select><select id="usage-group"><option value="date">按日期</option><option value="source">按 source</option><option value="public_model">按 public model</option><option value="upstream_model">按 upstream model</option><option value="session">按 session</option><option value="kind">按 kind</option></select><button data-action="load-usage">统计</button></div><div id="usage-list" class="table-wrap"></div></section>
    <section id="modules" class="tab"><div class="section-head"><h2>Module 管理</h2><button data-action="load-modules">刷新</button><button data-action="reload-modules">重新扫描</button></div><div id="module-list" class="table-wrap"></div></section>
    <section id="debug" class="tab"><div class="section-head"><h2>Memory Retrieval Debug</h2></div><div class="debug-query"><input id="debug-query" value="我之前喜欢什么键盘？"><input id="debug-limit" type="number" value="6" min="1" max="50"><button data-action="run-debug" class="primary">测试检索</button></div><div id="debug-list" class="table-wrap"></div></section>
  </main>
  <script type="module" src="/admin-ui/app.js"></script>
</body></html>
